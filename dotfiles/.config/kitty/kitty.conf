# Kitty config (dark glass)
font_family      JetBrains Mono
font_size        11.0
# Enable background opacity for translucency
background_opacity 0.85
# Use nice cursor and hide mouse when typing
cursor_shape beam
hide_mouse_when_typing yes
# Allow remote control (optional, useful for scripts)
enable_remote_control yes

# Color scheme hint (user can install a glass theme or use Kvantum for app styling)
# Colors can be adjusted or use a separate colors.conf file
